name: Test Tarave Runcommand bridge

on:
  push:
    branches:
      - experiment/retropie-standalone-20261013
      - fix/tarave-media-picker-progress-20261025
      - experiment/tarave-xtras-20261021
      - experiment/tarave-xtras-native-store-20261021
      - experiment/retropie-player-order-20261021
      - experiment/retropie-runcommand-bridge
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile C++11 backend tests
        run: >
          g++ -std=c++11 -Wall -Wextra -pedantic
          tests/test_retropie_runcommand_bridge.cpp
          -o /tmp/tarave-runcommand-test
      - name: Run backend tests
        run: /tmp/tarave-runcommand-test
      - name: Test RetroPie achievements theme status reader
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic \
            tests/test_tarave_retropie_achievements.cpp \
            -o /tmp/tarave-retropie-achievements-test
          /tmp/tarave-retropie-achievements-test
      - name: Check Tarave X-TRAS sources and private catalog
        run: python3 -m unittest discover -s tests -p test_tarave_xtras.py -v
      - name: Test manual media picker paths and filters
        run: python3 -m unittest discover -s tests -p test_tarave_media_picker.py -v
      - name: Test Tarave RetroArch player order bridge
        run: python3 -m unittest discover -s tests -p test_retropie_player_order.py -v
      - name: Test RetroPie settings-menu detection
        run: bash tests/test_tarave_retropie_menu.sh
      - name: Test standalone restart, power and language wiring
        run: python3 tests/test_tarave_standalone_menus.py
      - name: Ensure direct binary uses Tarave private home and --home overrides
        run: python3 tests/test_tarave_home_isolation.py
      - name: Test network interface selection (PPP/WWAN/USB/IPv6)
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic \
            tests/test_tarave_network_selection.cpp -o /tmp/tarave-network-test
          /tmp/tarave-network-test
      - name: Test RetroPie gamelist PNG icon and metadata fallback
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic \
            tests/test_tarave_retropie_gamelist.cpp -o /tmp/tarave-gamelist-test
          /tmp/tarave-gamelist-test
      - name: Verify isolated system path expansion and no ES-X implicit imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code = Path("es-app/src/SystemData.cpp").read_text()
          assert 'romHome = loginHome;' in code
          assert 'es_systems_legacy_import.cfg' in code
          assert 'srcSystems.append_copy(oldSystem);' not in code
          assert 'for (const char* configName' not in code
          PY
      - name: Test optional one-time Wine/Kodi import into private catalog
        run: python3 -m unittest discover -s tests -p test_tarave_import_legacy_systems.py -v
      - name: Validate bundled minimal offline theme
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = ET.parse("themes/tarave-minimal/theme.xml").getroot()
          assert root.tag == "theme" and root.findtext("formatVersion") == "7"
          assert (Path("resources") / "window_icon_256.png").is_file()
          assert (Path("resources") / "tarave-import-legacy-systems.py").is_file()
          PY

